name: weekly update
# Re-downloads the Oracle's Elixir files, re-runs the whole pipeline and republishes the page (docs/).
# The Worlds 2026 predictions in results/worlds2026/ are never re-run: they stay frozen.
on:
  schedule:
    - cron: '23 4 * * 1'      # Mondays 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest gdown
      - name: Download data
        id: data
        run: |
          set +e
          python scripts/fetch_data.py
          code=$?
          if [ $code -eq 3 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Run the pipeline
        if: steps.data.outputs.skip != 'true'
        run: bash run_all.sh
      - name: Score the frozen Worlds 2026 predictions (once Worlds games are in the data)
        if: steps.data.outputs.skip != 'true'
        run: python src/worlds_score.py && python src/page_data.py && python page/build_page.py
      - name: Tests
        if: steps.data.outputs.skip != 'true'
        run: python -m pytest -q tests/
      - name: Commit results and page
        if: steps.data.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results docs page/lol-ratings-3.html
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Weekly update: Oracle's Elixir data up to $(date -u +%F)"
          git push
